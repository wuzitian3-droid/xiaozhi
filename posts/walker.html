<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>自己走的点</title>
<style>html,body{margin:0;height:100%;background:#0d1117;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d');
let W,H,p,ang,trail;
function fit(){W=cv.width=innerWidth;H=cv.height=innerHeight;
 x.fillStyle='#0d1117';x.fillRect(0,0,W,H);
 p={x:W/2,y:H/2};ang=Math.random()*Math.PI*2;trail=[];}
addEventListener('resize',fit);fit();
const P=24; // 每步弧度扰动强度
function step(){
 // 会拐弯：角度每步随机偏一点，再往中心轻轻拉，免得跑出屏幕
 ang += (Math.random()-0.5)*2*P/1000*2;
 let dx=Math.cos(ang),dy=Math.sin(ang);
 const cx=W/2-p.x, cy=H/2-p.y, d=Math.hypot(cx,cy);
 if(d>Math.min(W,H)*0.4){ // 太靠边就回调
   const a=Math.atan2(cy,cx);
   ang = ang*0.9 + a*0.1;
 }
 p.x+=dx; p.y+=dy;
 trail.push([p.x,p.y]);
 if(trail.length>4000)trail.shift();
 // 每 600 步换颜色，看轨迹分段
}
let n=0;
function draw(){
 for(let i=0;i<6;i++){step();n++;}
 x.fillStyle='rgba(13,17,23,0.06)';x.fillRect(0,0,W,H);
 x.strokeStyle='rgba(120,220,180,0.34)';x.lineWidth=0.8;
 x.beginPath();
 for(let i=1;i<trail.length;i++){x.moveTo(trail[i-1][0],trail[i-1][1]);x.lineTo(trail[i][0],trail[i][1]);}
 x.stroke();
 x.fillStyle='#e6f0ff';
 x.beginPath();x.arc(p.x,p.y,2.4,0,7);x.fill();
 requestAnimationFrame(draw);
}
draw();
</script>
</body></html>
