<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>寿司大乱斗·自测</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#0d0a08;touch-action:none;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  canvas{display:block}
  #panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(10,7,6,.92);z-index:5;padding:22px}
  #panel.hide{display:none}
  .card{width:min(520px,92vw);background:#1c1512;border:1px solid #33261f;
    border-radius:18px;padding:26px 24px;color:#f0e5da}
  .card h1{font-size:26px;margin-bottom:10px;letter-spacing:.05em}
  .card .sub{color:#a08b7c;font-size:14.5px;line-height:1.95;margin-bottom:16px}
  .card .rank{color:#cbb7a4;font-size:15px;line-height:2.1;margin-bottom:10px}
  .srow{display:flex;align-items:center;gap:12px;margin:2px 0 18px;color:#cbb7a4;font-size:14px}
  .srow input{flex:1;height:26px;accent-color:#ffb45c}
  .srow b{width:48px;text-align:right;color:#ffd27a;font-size:14px}
  button{width:100%;height:60px;border:none;border-radius:14px;font-size:18px;font-weight:700;
    letter-spacing:.1em;color:#1a1206;background:linear-gradient(160deg,#ffd27a,#ff9c3d)}
  button:active{transform:translateY(1px)}
  .tip{color:#6d5c50;font-size:12.5px;line-height:1.8;margin-top:14px}
  #joy{position:fixed;left:22px;bottom:30px;width:132px;height:132px;z-index:4;pointer-events:none;
    opacity:.35;transition:opacity .12s}
  #joy.on{opacity:1}
  #joyRing{position:absolute;left:0;top:0;right:0;bottom:0;border-radius:50%;
    border:2px solid rgba(255,255,255,.16);background:rgba(255,255,255,.045)}
  #joyKnob{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;
    border-radius:50%;background:rgba(255,210,120,.55);border:2px solid rgba(255,235,190,.75);
    box-shadow:0 0 18px rgba(255,180,90,.35)}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="joy"><div id="joyRing"></div><div id="joyKnob"></div></div>

<div id="panel">
  <div class="card" id="card">
    <h1>寿司大乱斗</h1>
    <div class="sub">按住屏幕往哪推，寿司就往哪走，松手就停。<br>
      把别人撞出台子，自己别掉——掉下去 1 秒半在中间复活。<br>
      偶尔撞上会黏住一小会儿，谁也使不上劲，一块儿往外飘。<br>
      台子上撒着糖，撞到就吃，60 秒里吃得多的人赢。</div>
    <div class="srow"><span>快慢</span>
      <input id="spd" type="range" min="60" max="180" step="5" value="100">
      <b id="spdv">1.00×</b></div>
    <button id="btnStart">开始</button>
    <div class="tip">电脑上：WASD / 方向键。</div>
  </div>
</div>

<script>
(function(){
  var cvs = document.getElementById('c');
  var ctx = cvs.getContext('2d');
  var panel = document.getElementById('panel');
  var card = document.getElementById('card');

  var W=0,H=0,DPR=1, CX=0, CY=0, R=0;

  var P = {                     // 可调参数（按台子半径缩放）
    accel: 0, maxSpeed: 0, damping: 0.993, turnSpeed: 6.0, spd: 1.0,
    pr: 0,                      // 玩家半径
    respawn: 1.5, invincible: 0.7,
    candyInit: 12, candyInterval: 1.3, candyMax: 16,
    countdown: 3.0, matchTime: 60.0
  };

  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cvs.width = Math.floor(W*DPR); cvs.height = Math.floor(H*DPR);
    cvs.style.width = W+'px'; cvs.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    CX = W/2; CY = H*0.40;
    R = Math.min(W*0.46, H*0.30);
    P.pr = R*0.082;
    P.accel = R*3.6*(P.spd||1);
    P.maxSpeed = R*1.7*(P.spd||1);
  }

  var KINDS = [
    {name:'你',   top:'#ff7a5c', side:'#d4512f'},
    {name:'玉子', top:'#ffd76a', side:'#d9a72f'},
    {name:'虾',   top:'#ffb0bd', side:'#d97e8f'},
    {name:'海苔', top:'#54654f', side:'#33402f'}
  ];

  var G = {
    phase:'menu',        // menu | countdown | play | over
    t:0,
    cdEnd:0,
    timeLeft:60,
    arenaR:0,
    players:[],
    candies:[],
    candyTimer:0,
    msg:'', msgT:0
  };

  function newPlayer(i, human){
    var a = -Math.PI/2 + i*Math.PI/2;
    return {
      id:i, kind:KINDS[i], human:!!human,
      x:CX + Math.cos(a)*R*0.45,
      y:CY + Math.sin(a)*R*0.45,
      rot: Math.atan2(-Math.sin(a), -Math.cos(a)),
      vel:{x:0,y:0},
      score:0,
      state:'alive',          // alive | invincible | fallen
      fallTimer:0, invTimer:0,
      turn:0,
      knock:0,
      stuck:null,
      stickCool:0,
      aiTargetCandy:null,
      color:KINDS[i].top
    };
  }

  function reset(){
    resize();
    for(var kk in keyDir) keyDir[kk]=0;
    joy.x = joy.y = 0; joyId = null; if(joyEl) joyEl.classList.remove('on');
    G.players = [newPlayer(0,true), newPlayer(1,false), newPlayer(2,false), newPlayer(3,false)];
    G.candies = [];
    for(var i=0;i<P.candyInit;i++) spawnCandy();
    G.candyTimer = P.candyInterval;
    G.timeLeft = P.matchTime;
    G.arenaR = R;
    G.phase = 'countdown';
    G.cdEnd = performance.now() + P.countdown*1000;
    G.msg=''; 
    panel.classList.add('hide');
  }

  function spawnCandy(){
    if(G.candies.length >= P.candyMax) return;
    var ang = Math.random()*Math.PI*2;
    var ar = G.arenaR || R;
    var d = ar*(0.18 + Math.random()*0.62);
    G.candies.push({x:CX+Math.cos(ang)*d, y:CY+Math.sin(ang)*d, col:KINDS[Math.floor(Math.random()*4)].top, phase:Math.random()*6.28});
  }

  function say(t){ G.msg = t; G.msgT = performance.now(); }

  function endMatch(){
    G.phase = 'over';
    var list = G.players.slice().sort(function(a,b){ return b.score - a.score; });
    var lines = '';
    list.forEach(function(p,i){
      lines += (i+1) + '. ' + p.kind.name + ' — ' + p.score + ' 颗<br>';
    });
    var head = (list[0].human) ? '你赢了' : (list[0].kind.name + ' 赢了');
    if(list[0].score === list[1].score) head = '打平';
    card.innerHTML = '<h1>结算：' + head + '</h1><div class="rank">' + lines + '</div>' +
      '<button id="btnAgain">再来一局</button>' +
      '<div class="tip">你吃了 ' + G.players[0].score + ' 颗糖。</div>';
    panel.classList.remove('hide');
    document.getElementById('btnAgain').addEventListener('click', reset);
    document.getElementById('btnAgain').addEventListener('pointerdown', function(e){ e.preventDefault(); reset(); });
  }

  // ---------- 输入：漂移摇杆 ----------
  var joy = {x:0, y:0};        // 单位方向 × 力度（0~1）
  var joyEl = document.getElementById('joy');
  var knobEl = document.getElementById('joyKnob');
  var joyId = null, joyOx = 0, joyOy = 0;
  var JOY_R = 62;

  function showJoy(cx, cy){
    joyEl.style.left = (cx - 66) + 'px';
    joyEl.style.top  = (cy - 66) + 'px';
    joyEl.style.bottom = 'auto';
    joyEl.classList.add('on');
    joyOx = cx; joyOy = cy;
    moveKnob(0, 0);
  }
  function moveKnob(dx, dy){
    knobEl.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
  }
  function hideJoy(){
    joyEl.classList.remove('on');
    joyEl.style.left = ''; joyEl.style.top = ''; joyEl.style.bottom = '';
    joy.x = joy.y = 0;
    moveKnob(0,0);
  }

  function inPanel(el){
    while(el && el !== document.body){
      if(el.id === 'panel') return true;
      el = el.parentNode;
    }
    return false;
  }

  addEventListener('pointerdown', function(e){
    if(G.phase !== 'play' && G.phase !== 'countdown') return;
    if(joyId !== null || inPanel(e.target)) return;
    joyId = e.pointerId;
    // 按在摇杆圈里就从圈心算；按在别处，就把摇杆挪到手指底下
    var r = joyEl.getBoundingClientRect();
    var bx = r.left + r.width/2, by = r.top + r.height/2;
    if(Math.hypot(e.clientX-bx, e.clientY-by) < r.width*0.75){
      showJoy(bx, by);
    } else {
      showJoy(e.clientX, e.clientY);
    }
    e.preventDefault();
  }, {passive:false});

  addEventListener('pointermove', function(e){
    if(e.pointerId !== joyId) return;
    var dx = e.clientX - joyOx, dy = e.clientY - joyOy;
    var d = Math.hypot(dx, dy);
    if(d > JOY_R){ dx = dx/d*JOY_R; dy = dy/d*JOY_R; }
    moveKnob(dx, dy);
    joy.x = d>0 ? dx/JOY_R : 0;
    joy.y = d>0 ? dy/JOY_R : 0;
    e.preventDefault();
  }, {passive:false});

  function endJoy(e){
    if(e.pointerId !== joyId) return;
    joyId = null;
    hideJoy();
  }
  addEventListener('pointerup', endJoy);
  addEventListener('pointercancel', endJoy);

  // 键盘（电脑上也能玩）
  var keyDir = {};
  function keyVec(){
    var kx = ((keyDir['d']||keyDir['arrowright'])?1:0) - ((keyDir['a']||keyDir['arrowleft'])?1:0);
    var ky = ((keyDir['s']||keyDir['arrowdown'])?1:0) - ((keyDir['w']||keyDir['arrowup'])?1:0);
    var l = Math.hypot(kx, ky);
    return l ? {x:kx/l, y:ky/l} : {x:0,y:0};
  }
  addEventListener('keydown', function(e){
    var k = e.key.toLowerCase();
    if(G.phase==='menu' && (e.key===' '||e.key==='Enter')){ reset(); return; }
    keyDir[k] = 1;
    var v = keyVec(); joy.x = v.x; joy.y = v.y;
  });
  addEventListener('keyup', function(e){
    keyDir[e.key.toLowerCase()] = 0;
    var v = keyVec(); joy.x = v.x; joy.y = v.y;
  });

  // 快慢滑块
  var spdEl = document.getElementById('spd'), spdvEl = document.getElementById('spdv');
  function readSpd(){
    P.spd = parseInt(spdEl.value,10)/100;
    spdvEl.textContent = P.spd.toFixed(2) + '×';
    resize();
  }
  spdEl.addEventListener('input', readSpd);
  spdEl.addEventListener('change', readSpd);
  readSpd();

  var bStart = document.getElementById('btnStart');
  bStart.addEventListener('click', reset);
  bStart.addEventListener('pointerdown', function(e){ e.preventDefault(); reset(); });

  // 点哪儿都能开局，省得手机点偏
  document.addEventListener('pointerdown', function(e){
    if(G.phase === 'menu' && !(e.target && e.target.id === 'btnAgain')) reset();
  });
  document.addEventListener('click', function(e){
    if(G.phase === 'menu' && !(e.target && e.target.id === 'btnAgain')) reset();
  });

  // ---------- 物理 ----------
  function updatePlayers(dt){
    var list = G.players;
    // 黏住的一对：谁也使不上劲，像一块儿飘
    for(var s0=0;s0<list.length;s0++){
      var p0=list[s0];
      if(!p0.stuck) continue;
      var o0 = p0.stuck.with;
      if(!o0 || !o0.stuck || o0.stuck.with !== p0){ p0.stuck=null; continue; }
      if(p0.id > o0.id) continue;
      p0.stuck.t -= dt; o0.stuck.t = p0.stuck.t;
      var dxs=o0.x-p0.x, dys=o0.y-p0.y, ds=Math.hypot(dxs,dys)||1;
      var nxs=dxs/ds, nys=dys/ds;
      var cvx=(p0.vel.x+o0.vel.x)/2, cvy=(p0.vel.y+o0.vel.y)/2;
      var kd = Math.pow(0.985, dt*60);
      cvx *= kd; cvy *= kd;
      p0.vel.x=o0.vel.x=cvx; p0.vel.y=o0.vel.y=cvy;
      p0.knock=0; o0.knock=0;
      if(p0.stuck.t <= 0){
        var push = P.maxSpeed*0.5;                 // 分开那一下，各自往两边弹开
        p0.vel.x -= nxs*push; p0.vel.y -= nys*push;
        o0.vel.x += nxs*push; o0.vel.y += nys*push;
        p0.stuck=null; o0.stuck=null;
        p0.stickCool = 1.4; o0.stickCool = 1.4;
        if(p0.human||o0.human) say('分开了');
      }
    }

    for(var i=0;i<list.length;i++){
      var p = list[i];
      if(p.state === 'fallen'){
        p.fallTimer -= dt;
        if(p.fallTimer <= 0) respawn(p);
        continue;
      }
      if(p.state === 'invincible'){
        p.invTimer -= dt;
        if(p.invTimer <= 0) p.state = 'alive';
      }

      // 往哪推就往哪走（摇杆 / 电脑上的方向键）
      var ax2=0, ay2=0;
      if(p.human){
        ax2 = joy.x; ay2 = joy.y;
      } else {
        var git = aiAim(p);
        ax2 = git.x; ay2 = git.y;
      }
      var amag = Math.hypot(ax2, ay2);
      if(amag > 0.01){
        // 头朝着走的方向，慢慢转过去，不像指针那样瞬间翻转
        var want = Math.atan2(ay2, ax2);
        var df = ((want - p.rot + Math.PI*3) % (Math.PI*2)) - Math.PI;
        p.rot += df * Math.min(1, 9*dt);
      }

      if(p.knock > 0) p.knock -= dt;
      if(p.stickCool > 0) p.stickCool -= dt;

      // 被撞飞的这一小会儿自己使不上劲，就靠惯性滑——这样撞一下才看得出后果
      if(p.knock <= 0 && !p.stuck && amag > 0.01){
        var push = P.accel * (p.human ? 1 : 0.82);   // 我这些对手不比我快
        p.vel.x += ax2 * push * dt;
        p.vel.y += ay2 * push * dt;
      }

      var sp = Math.hypot(p.vel.x, p.vel.y);
      if(sp > P.maxSpeed && p.knock <= 0){
        p.vel.x = p.vel.x/sp*P.maxSpeed;
        p.vel.y = p.vel.y/sp*P.maxSpeed;
      }
      var damp = Math.pow(p.knock > 0 ? 0.998 : P.damping, dt*60);
      p.vel.x *= damp; p.vel.y *= damp;

      p.x += p.vel.x * dt;
      p.y += p.vel.y * dt;
    }

    // 玩家-玩家碰撞：等质量刚体，法向冲量 + 切向摩擦
    for(var i2=0;i2<list.length;i2++){
      for(var j=i2+1;j<list.length;j++){
        var a=list[i2], b=list[j];
        if(a.state==='fallen' || b.state==='fallen') continue;
        if(a.stuck && a.stuck.with===b) continue;   // 已经黏在一起了，不再互撞
        var dx=b.x-a.x, dy=b.y-a.y;
        var d=Math.hypot(dx,dy), min=P.pr*2;
        if(d>0 && d<min){
          var nx=dx/d, ny=dy/d, overlap=min-d;
          var aw = a.state==='invincible' ? 0 : 1;   // 0 = 无限重，撞不动
          var bw = b.state==='invincible' ? 0 : 1;
          if(aw+bw===0){ aw=0.5; bw=0.5; }
          var awN = aw/(aw+bw), bwN = bw/(aw+bw);
          a.x -= nx*overlap*awN; a.y -= ny*overlap*awN;
          b.x += nx*overlap*bwN; b.y += ny*overlap*bwN;

          // 偶尔会黏住：撞上的那一下粘在一起，谁也推不动，一块儿往外飘
          if(!a.stuck && !b.stuck && a.stickCool<=0 && b.stickCool<=0
             && a.state==='alive' && b.state==='alive'
             && Math.random() < 0.3){
            var tt = 0.4 + Math.random()*0.45;
            a.stuck = {with:b, t:tt};
            b.stuck = {with:a, t:tt};
            a.stickCool = 2.5; b.stickCool = 2.5;      // 黏过一次，两个人都得缓一会儿
            if(a.human||b.human) say('黏住了');
            continue;
          }

          var van = a.vel.x*nx + a.vel.y*ny;
          var vbn = b.vel.x*nx + b.vel.y*ny;
          var vrel = van - vbn;                    // 接近速度：整下撞击的力度就按它算
          if(vrel > 0){
            var e = 0.90;                          // 弹性系数：撞完先弹开，不许黏在一起
            var jn = -(1+e)*vrel / (aw + bw);
            var ia = -jn*aw, ib = jn*bw;
            a.vel.x += ia*nx; a.vel.y += ia*ny;
            b.vel.x += ib*nx; b.vel.y += ib*ny;

            // 切向摩擦：斜着蹭过去会把对方带歪一点
            var tx=-ny, ty=nx;
            var vat = a.vel.x*tx + a.vel.y*ty;
            var vbt = b.vel.x*tx + b.vel.y*ty;
            var jt = -(vat - vbt)*0.10;
            if(aw+bw>0){ jt /= (aw+bw); }
            a.vel.x += jt*tx*aw; a.vel.y += jt*ty*aw;
            b.vel.x -= jt*tx*bw; b.vel.y -= jt*ty*bw;

            // 撞完谁被推走多远，跟相对速度成正比——撞得越快，飞得越远
            var hit = Math.min(1.2, vrel/P.maxSpeed);
            var stun = 0.08 + hit*0.26;
            if(van > vbn){                         // a 追尾 b：b 站不住，a 还能迈步
              if(bw) b.knock = Math.max(b.knock, stun);
              if(aw) a.knock = Math.max(a.knock, stun*0.16);
            } else {
              if(aw) a.knock = Math.max(a.knock, stun);
              if(bw) b.knock = Math.max(b.knock, stun*0.16);
            }

            // 飞出去的速度封个顶，免得太远
            [a,b].forEach(function(q){
              var s = Math.hypot(q.vel.x, q.vel.y);
              var cap = P.maxSpeed*1.45;
              if(s > cap){ q.vel.x = q.vel.x/s*cap; q.vel.y = q.vel.y/s*cap; }
            });
          }
        }
      }
    }

    // 边界：先有一段边缘阻力，挣得回来；真冲出去才掉
    for(var i3=0;i3<list.length;i3++){
      var p3 = list[i3];
      if(p3.state==='fallen') continue;
      var dd = Math.hypot(p3.x-CX, p3.y-CY);
      var lim = G.arenaR + P.pr*0.45;
      if(dd > G.arenaR*0.9 && dd <= lim && dd > 0){
        var ex=(p3.x-CX)/dd, ey=(p3.y-CY)/dd;
        var outv = p3.vel.x*ex + p3.vel.y*ey;
        if(outv > 0){
          var kk = (dd - G.arenaR*0.9) / Math.max(1, lim - G.arenaR*0.9);
          var cut = Math.min(outv, outv*(3.4 + kk*4.5)*dt);
          p3.vel.x -= ex*cut; p3.vel.y -= ey*cut;
        }
      }
      if(dd > lim){
        if(p3.stuck && p3.stuck.with){ p3.stuck.with.stuck = null; }
        p3.stuck = null;
        p3.state = 'fallen';
        p3.fallTimer = P.respawn;
        p3.vel.x = p3.vel.y = 0;
        if(p3.human) say('你掉下去了');
      }
    }

    // 糖果
    for(var k=G.candies.length-1;k>=0;k--){
      var c = G.candies[k];
      for(var m=0;m<list.length;m++){
        var pm = list[m];
        if(pm.state==='fallen') continue;
        if(Math.hypot(pm.x-c.x, pm.y-c.y) < P.pr + R*0.055){
          pm.score++;
          G.candies.splice(k,1);
          break;
        }
      }
    }

    G.candyTimer -= dt;
    if(G.candyTimer <= 0){ G.candyTimer = P.candyInterval; spawnCandy(); }
  }

  function respawn(p){
    p.x = CX; p.y = CY;
    p.rot = Math.random()*Math.PI*2;
    p.vel.x = p.vel.y = 0;
    p.knock = 0;
    p.stuck = null;
    p.state = 'invincible';
    p.invTimer = P.invincible;
  }

  // ---------- AI：奔最近的糖，靠边就往中间撤 ----------
  function aiAim(p){
    var cx=CX, cy=CY;
    var distCenter = Math.hypot(p.x-cx, p.y-cy);
    var aimX, aimY;

    if(distCenter > G.arenaR*0.8){          // 太靠边，先回中间
      aimX = cx; aimY = cy;
    } else {
      var best = null, bd = 1e9;
      for(var i=0;i<G.candies.length;i++){
        var c = G.candies[i];
        var d = Math.hypot(c.x-p.x, c.y-p.y);
        if(d < bd){ bd = d; best = c; }
      }
      if(best){ aimX = best.x; aimY = best.y; }
      else { aimX = cx; aimY = cy; }
    }
    var vx = aimX-p.x, vy = aimY-p.y;
    var l = Math.hypot(vx,vy);
    if(l < 1) return {x:0,y:0};
    return {x:vx/l, y:vy/l};
  }

  // ---------- 渲染 ----------
  function drawSushi(p, now){
    var r = P.pr;
    ctx.save();
    ctx.translate(p.x, p.y);

    // 影子
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.ellipse(2, r*0.55, r*0.95, r*0.45, 0, 0, Math.PI*2); ctx.fill();

    ctx.rotate(p.rot + Math.PI/2);

    if(p.state==='fallen'){
      ctx.globalAlpha = 0.25;
    } else if(p.state==='invincible'){
      ctx.globalAlpha = 0.65 + Math.abs(Math.sin(now/110))*0.35;
    }

    // 米饭
    ctx.fillStyle = '#f7f0e4';
    ctx.beginPath(); ctx.ellipse(0,0, r*0.92, r*1.05, 0, 0, Math.PI*2); ctx.fill();

    // 料
    ctx.fillStyle = p.kind.top;
    ctx.beginPath(); ctx.ellipse(0,-r*0.18, r*0.86, r*0.72, 0, 0, Math.PI*2); ctx.fill();

    // 海苔带
    ctx.fillStyle = 'rgba(26,30,26,0.82)';
    ctx.fillRect(-r*0.13, -r*1.05, r*0.26, r*2.1);

    // 刀（朝着行进方向）
    ctx.fillStyle = '#e3e8ee';
    ctx.fillRect(-r*0.07, -r*1.62, r*0.14, r*0.62);
    ctx.fillStyle = '#8a6b4a';
    ctx.fillRect(-r*0.11, -r*1.12, r*0.22, r*0.16);

    ctx.restore();

    // 名字
    ctx.globalAlpha = 1;
    ctx.textAlign='center';
    ctx.font='600 12px -apple-system,"PingFang SC",sans-serif';
    ctx.fillStyle = p.human ? '#ffd27a' : 'rgba(255,255,255,0.45)';
    ctx.fillText(p.kind.name, p.x, p.y + P.pr*2.1);
  }

  function draw(now){
    joyEl.style.display = (G.phase==='play'||G.phase==='countdown') ? 'block' : 'none';
    var g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#1d1512'); g.addColorStop(0.55,'#140f0d'); g.addColorStop(1,'#0b0807');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

    // 台子
    var AR = G.arenaR || R;
    var shrinking = AR < R - 1;
    var rg = ctx.createRadialGradient(CX-R*0.2, CY-R*0.25, R*0.1, CX, CY, AR*1.05);
    rg.addColorStop(0,'#3a2b21'); rg.addColorStop(0.75,'#241a15'); rg.addColorStop(1,'#160f0c');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(CX, CY, AR, 0, Math.PI*2); ctx.fill();

    // 缩圈时边界发红、闪
    if(shrinking){
      ctx.strokeStyle = 'rgba(255,110,80,' + (0.45 + Math.abs(Math.sin(now/160))*0.35) + ')';
      ctx.lineWidth = 5;
    } else {
      ctx.strokeStyle = 'rgba(255,205,150,0.22)';
      ctx.lineWidth = 3;
    }
    ctx.beginPath(); ctx.arc(CX, CY, AR, 0, Math.PI*2); ctx.stroke();

    for(var i=1;i<4;i++){
      ctx.strokeStyle='rgba(255,255,255,0.035)';
      ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(CX, CY, AR*i/4, 0, Math.PI*2); ctx.stroke();
    }

    // 糖果
    G.candies.forEach(function(c){
      var pulse = 1 + Math.sin(now/240 + c.phase)*0.12;
      var rr = R*0.052*pulse;
      var cg = ctx.createRadialGradient(c.x-rr*0.3, c.y-rr*0.3, 0, c.x, c.y, rr*1.6);
      cg.addColorStop(0, '#ffffff');
      cg.addColorStop(0.35, c.col);
      cg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = cg;
      ctx.beginPath(); ctx.arc(c.x, c.y, rr*1.6, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = c.col;
      ctx.beginPath(); ctx.arc(c.x, c.y, rr, 0, Math.PI*2); ctx.fill();
    });

    G.players.slice().sort(function(a,b){ return (a.state==='fallen'?0:1)-(b.state==='fallen'?0:1); })
      .forEach(function(p){ drawSushi(p, now); });

    // 黏在一起的两个，中间拉一根带子
    G.players.forEach(function(p){
      var o = p.stuck && p.stuck.with;
      if(o && p.id < o.id){
        ctx.strokeStyle = 'rgba(255,214,150,0.75)';
        ctx.lineWidth = 5;
        ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(o.x,o.y); ctx.stroke();
      }
    });

    // 分数条
    ctx.textAlign='left';
    ctx.font='700 15px -apple-system,"PingFang SC",sans-serif';
    G.players.forEach(function(p,i){
      var y = 30 + i*24;
      ctx.fillStyle = p.kind.top;
      ctx.beginPath(); ctx.arc(24, y-5, 6, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = p.human ? '#f5ead9' : 'rgba(255,255,255,0.55)';
      ctx.fillText(p.kind.name + '  ' + p.score, 40, y);
    });

    // 时间
    ctx.textAlign='right';
    ctx.font='800 26px -apple-system,"PingFang SC",sans-serif';
    ctx.fillStyle = (G.phase==='play' && G.timeLeft<10) ? '#ff7a5c' : '#e9dccd';
    ctx.fillText(Math.max(0, Math.ceil(G.timeLeft)) + 's', W-24, 44);

    // 倒计时
    if(G.phase==='countdown'){
      var left = Math.max(0, (G.cdEnd - now)/1000);
      ctx.textAlign='center';
      ctx.fillStyle='rgba(0,0,0,0.45)';
      ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#ffe6cf';
      ctx.font='800 96px -apple-system,"PingFang SC",sans-serif';
      ctx.fillText(String(Math.ceil(left)), CX, CY+30);
      ctx.font='600 16px -apple-system,"PingFang SC",sans-serif';
      ctx.fillStyle='#a08b7c';
      ctx.fillText('按住屏幕，往哪推就往哪走', CX, CY+90);
    }

    // 掉落提示
    if(G.msg && (now-G.msgT)<1200){
      var a = 1-(now-G.msgT)/1200;
      ctx.globalAlpha = Math.max(0,a);
      ctx.textAlign='center';
      ctx.fillStyle='#ffd9c6';
      ctx.font='700 22px -apple-system,"PingFang SC",sans-serif';
      ctx.fillText(G.msg, CX, CY+R+54);
      ctx.globalAlpha=1;
    }
  }

  var last = 0;
  function frame(now){
    var dt = last ? Math.min((now-last)/1000, 0.05) : 0.016;
    last = now;

    if(G.phase === 'countdown'){
      if(now >= G.cdEnd){ G.phase='play'; say('开始'); }
    } else if(G.phase === 'play'){
      // 缩圈：过了三分之一时间开始收，一直收到一半大
      var passed = Math.max(0, (P.matchTime - G.timeLeft) - P.matchTime*0.3);
      var prog = Math.min(1, passed / (P.matchTime*0.6));
      G.arenaR = R*(1 - 0.62*prog);

      updatePlayers(dt);

      // 圈外的糖吃掉（收回来）
      for(var ci=G.candies.length-1; ci>=0; ci--){
        if(Math.hypot(G.candies[ci].x-CX, G.candies[ci].y-CY) > G.arenaR*0.95) G.candies.splice(ci,1);
      }

      G.timeLeft -= dt;
      if(G.timeLeft <= 0){ G.timeLeft = 0; endMatch(); }
    }

    draw(now);
    requestAnimationFrame(frame);
  }

  resize();
  requestAnimationFrame(frame);

  // ===== 自动跑一局：让自己也玩一玩，看手感 =====
  function selfRun(){
    var players = null;
    var falls = 0, stickEvents = 0, maxStuckFrames = 0, stuckRun = 0;
    var spdSum = 0, n = 0;
    reset();
    G.phase = 'play';
    G.timeLeft = P.matchTime;
    players = G.players;
    var prev = players.map(function(p){ return p.state; });
    var wasStuck = players.map(function(p){ return false; });
    var frames = 60 * 60;
    for(var step=0; step<frames; step++){
      var passed = Math.max(0, (P.matchTime - G.timeLeft) - P.matchTime*0.3);
      var prog = Math.min(1, passed / (P.matchTime*0.6));
      G.arenaR = R*(1 - 0.62*prog);

      var aim = aiAim(players[0]);
      joy.x = aim.x; joy.y = aim.y;
      updatePlayers(1/60);

      for(var i=0;i<players.length;i++){
        var p = players[i];
        if(prev[i] !== 'fallen' && p.state === 'fallen') falls++;
        prev[i] = p.state;
        var isn = !!p.stuck;
        if(isn && !wasStuck[i]) stickEvents++;
        wasStuck[i] = isn;
      }
      if(players[0].stuck){ stuckRun++; if(stuckRun>maxStuckFrames) maxStuckFrames = stuckRun; }
      else stuckRun = 0;

      spdSum += Math.hypot(players[0].vel.x, players[0].vel.y); n++;
      G.timeLeft -= 1/60;
    }
    var avg = (spdSum/n)/P.maxSpeed;
    var msg = '自测：摔下去的次数 ' + falls
            + ' / 黏 ' + Math.round(stickEvents/2) + ' 次'
            + ' / 平均速度 ' + avg.toFixed(2) + ' 倍上限'
            + ' / 我被困最久 ' + Math.round(maxStuckFrames/60*100)/100 + ' 秒';
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;left:8px;right:8px;top:70px;z-index:99;color:#fff;' +
      'background:rgba(0,0,0,.82);padding:10px;font:15px/1.6 monospace;white-space:pre-wrap';
    d.id = 'selfout';
    d.textContent = msg;
    document.body.appendChild(d);
    document.title = msg;
  }
  selfRun();

})();
</script>
</body>
