<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>寿司大乱斗</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#120e0c;touch-action:none;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  canvas{display:block}
  #panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(10,7,6,.93);z-index:5;padding:22px}
  #panel.hide{display:none}
  .card{width:min(520px,92vw);background:#1c1512;border:1px solid #33261f;
    border-radius:18px;padding:26px 24px;color:#f0e5da}
  .card h1{font-size:26px;margin-bottom:10px;letter-spacing:.05em}
  .card .sub{color:#a08b7c;font-size:14.5px;line-height:1.95;margin-bottom:16px}
  button{width:100%;height:60px;border:none;border-radius:14px;font-size:18px;font-weight:700;
    letter-spacing:.1em;color:#1a1206;background:linear-gradient(160deg,#ffd27a,#ff9c3d)}
  button:active{transform:translateY(1px)}
  .tip{color:#6d5c50;font-size:12.5px;line-height:1.8;margin-top:14px}
  #pad{position:fixed;inset:auto 0 0 0;height:26vh;display:flex;align-items:flex-end;
    justify-content:space-between;padding:0 16px 18px;z-index:4;pointer-events:none}
  #pad .side{display:flex;gap:14px;pointer-events:auto}
  .kbtn{width:96px;height:96px;border-radius:50%;border:2px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.07);color:#f4e9de;font-size:30px;display:flex;
    align-items:center;justify-content:center;backdrop-filter:blur(3px)}
  #btnHit{width:118px;height:118px;font-size:22px;font-weight:800;letter-spacing:.08em;
    background:rgba(255,140,90,.22);border-color:rgba(255,140,90,.5);color:#ffd9c6}
  .kbtn.on{background:rgba(255,255,255,.2)}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="pad">
  <div class="side">
    <div class="kbtn" id="btnL">◀</div>
    <div class="kbtn" id="btnR">▶</div>
  </div>
  <div class="side">
    <div class="kbtn" id="btnHit">砍</div>
  </div>
</div>

<div id="panel">
  <div class="card" id="card">
    <h1>寿司大乱斗</h1>
    <div class="sub">一块米饭，一片料，一把刀。<br>
      左右跑，靠近了就砍。挨砍会退，血空了就倒下。<br>
      场上四个，最后站着的是赢家。</div>
    <button id="btnStart">开始</button>
    <div class="tip">刀不长，得凑近了才砍得到。别背对着人跑。</div>
  </div>
</div>

<script>
(function(){
  var cvs = document.getElementById('c');
  var ctx = cvs.getContext('2d');
  var panel = document.getElementById('panel');
  var card = document.getElementById('card');
  var W=0,H=0,DPR=1,GROUND=0;

  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cvs.width = Math.floor(W*DPR); cvs.height = Math.floor(H*DPR);
    cvs.style.width = W+'px'; cvs.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    GROUND = H*0.64;
  }
  resize();
  window.addEventListener('resize', resize);

  var G = { phase:'idle', players:[], t:0, msg:'', msgT:0 };

  var KINDS = [
    {name:'你',   rice:'#f6efe2', top:'#ff7a5c', edge:'#d4512f', isPlayer:true},
    {name:'玉子', rice:'#f6efe2', top:'#ffd76a', edge:'#d9a72f'},
    {name:'虾',   rice:'#f6efe2', top:'#ffb0bd', edge:'#d97e8f'},
    {name:'海苔', rice:'#f6efe2', top:'#4a5a4a', edge:'#2c372c'}
  ];

  var MOVE = 330, PAD_W = 92, PAD_H = 96;

  function makePlayer(kind, x){
    return {
      kind:kind, x:x, vx:0, hp:100, facing:1,
      cd:0, atk:0, hurt:0, dead:false,
      isPlayer:!!kind.isPlayer, aiTimer:0, target:null,
      walk:0
    };
  }

  function start(){
    if(G.phase==='play') return;
    G.players = [];
    var n = KINDS.length;
    for(var i=0;i<n;i++){
      var x = W*(0.22 + 0.56*i/(n-1));
      G.players.push(makePlayer(KINDS[i], x));
    }
    G.phase='play';
    G.msg=''; 
    panel.classList.add('hide');
    say('开打');
  }

  function say(t){ G.msg=t; G.msgT=performance.now(); }

  function alive(){ return G.players.filter(function(p){return !p.dead}); }

  function end(){
    G.phase='over';
    var me = G.players[0];
    var head, sub;
    var left = alive();
    if(!me.dead && left.length===1){ head='你赢了'; sub='场上就剩你一块寿司站着。'; }
    else if(me.dead){
      var top = left[0];
      head = '倒下了';
      sub = '最后站着的是' + top.kind.name + '。再来一把？';
    } else { head='打完了'; sub='还剩 '+left.length+' 块。'; }
    card.innerHTML = '<h1>'+head+'</h1><div class="sub">'+sub+'</div>'+
      '<button id="btnAgain">再来一局</button>';
    panel.classList.remove('hide');
    document.getElementById('btnAgain').addEventListener('click', start);
  }

  var keys = {l:false, r:false};
  function bindHold(el, on, off){
    el.addEventListener('pointerdown', function(e){ e.preventDefault(); el.classList.add('on'); on(); });
    ['pointerup','pointercancel','pointerleave'].forEach(function(ev){
      el.addEventListener(ev, function(){ el.classList.remove('on'); if(off) off(); });
    });
  }
  var btnL=document.getElementById('btnL'), btnR=document.getElementById('btnR'),
      btnHit=document.getElementById('btnHit');
  bindHold(btnL, function(){keys.l=true;}, function(){keys.l=false;});
  bindHold(btnR, function(){keys.r=true;}, function(){keys.r=false;});
  btnHit.addEventListener('pointerdown', function(e){ e.preventDefault(); doHit(G.players[0]); });
  btnHit.addEventListener('click', function(){ doHit(G.players[0]); });

  document.getElementById('btnStart').addEventListener('click', start);
  document.getElementById('btnStart').addEventListener('pointerdown', function(e){ e.preventDefault(); start(); });

  function doHit(p){
    if(!p || p.dead || G.phase!=='play') return;
    if(p.cd > 0) return;
    p.cd = 0.42; p.atk = 0.26;
    // 判定：面前一段距离
    var reach = 118;
    var lo = p.facing>0 ? p.x+20 : p.x-20-reach;
    var hi = lo + reach;
    G.players.forEach(function(q){
      if(q===p || q.dead) return;
      if(q.x > lo - PAD_W*0.35 && q.x < hi + PAD_W*0.35){
        q.hp -= 13;
        q.hurt = 0.22;
        q.x += p.facing * 26;
        q.x = Math.max(PAD_W*0.4, Math.min(W-PAD_W*0.4, q.x));
        if(q.hp <= 0){ q.hp = 0; q.dead = true; q.vx = p.facing*90; }
      }
    });
  }

  function aiStep(p, dt){
    var others = G.players.filter(function(q){ return q!==p && !q.dead; });
    if(!others.length) return;
    var t = others[0], best = 1e9;
    others.forEach(function(q){
      var d = Math.abs(q.x-p.x);
      if(d<best){best=d; t=q;}
    });
    var dx = t.x - p.x;
    if(Math.abs(dx) > 104){
      p.facing = dx>0?1:-1;
      p.x += p.facing * MOVE*0.82 * dt;
    } else {
      p.facing = dx>0?1:-1;
      p.aiTimer -= dt;
      if(p.aiTimer <= 0){
        p.aiTimer = 0.55 + Math.random()*0.35;
        doHit(p);
      }
    }
    p.x = Math.max(PAD_W*0.4, Math.min(W-PAD_W*0.4, p.x));
  }

  var last=0;
  function frame(now){
    var dt = last ? Math.min((now-last)/1000, 0.05) : 0.016;
    last = now;

    if(G.phase==='play'){
      var me = G.players[0];
      if(me && !me.dead){
        var dir = (keys.l?-1:0) + (keys.r?1:0);
        if(dir){ me.facing = dir; me.x += dir*MOVE*dt; me.walk += Math.abs(dir)*dt*12; }
        me.x = Math.max(PAD_W*0.4, Math.min(W-PAD_W*0.4, me.x));
      }
      G.players.forEach(function(p){
        if(p.cd>0) p.cd -= dt;
        if(p.atk>0) p.atk -= dt;
        if(p.hurt>0) p.hurt -= dt;
        if(p.dead){
          if(Math.abs(p.vx)>4){ p.x += p.vx*dt; p.vx *= 0.86; }
        } else if(!p.isPlayer){
          aiStep(p, dt);
        }
      });

      var left = G.players.filter(function(p){ return !p.dead; });
      if(left.length <= 1){ end(); }
    }

    draw(now);
    requestAnimationFrame(frame);
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawSushi(p, now){
    var k = p.kind;
    var bob = p.dead ? 0 : Math.sin((now/1000)*6 + p.x*0.02) * 2;
    var y = GROUND + bob;
    var w = PAD_W, h = PAD_H*0.72;

    ctx.save();
    if(p.dead){
      ctx.translate(p.x, GROUND + 40);
      ctx.rotate(Math.PI/2 * 0.92);
      ctx.globalAlpha = 0.5;
      ctx.translate(-p.x, -(GROUND+40));
    }
    if(p.hurt>0){
      ctx.globalAlpha = 0.55 + Math.sin(now/26)*0.35;
    }

    // 影子
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.ellipse(p.x, GROUND+46, w*0.44, 12, 0, 0, Math.PI*2); ctx.fill();

    // 米饭
    ctx.fillStyle = k.rice;
    roundRect(p.x-w/2, y, w, h, 22); ctx.fill();

    // 料
    ctx.fillStyle = k.top;
    roundRect(p.x-w/2-4, y-14, w+8, h*0.52, 18); ctx.fill();

    // 海苔带
    ctx.fillStyle = 'rgba(20,24,20,0.85)';
    ctx.fillRect(p.x-7, y-16, 14, h*0.62+16);

    // 眼睛
    if(!p.dead){
      ctx.fillStyle = '#241a14';
      var ex = p.facing*7;
      ctx.beginPath(); ctx.arc(p.x-18+ex, y+h*0.48, 5.2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(p.x+18+ex, y+h*0.48, 5.2, 0, Math.PI*2); ctx.fill();
    } else {
      ctx.strokeStyle='#241a14'; ctx.lineWidth=3;
      ctx.beginPath();
      ctx.moveTo(p.x-24,y+h*0.44); ctx.lineTo(p.x-12,y+h*0.52);
      ctx.moveTo(p.x-12,y+h*0.44); ctx.lineTo(p.x-24,y+h*0.52);
      ctx.stroke();
    }

    // 刀
    if(!p.dead){
      var swing = p.atk>0 ? (1 - p.atk/0.26) : 0;
      var ang = p.facing>0 ? -0.5 + swing*1.9 : Math.PI+0.5 - swing*1.9;
      ctx.save();
      ctx.translate(p.x + p.facing*w*0.42, y+h*0.4);
      ctx.rotate(ang);
      ctx.fillStyle='#d8dde4';
      roundRect(0,-4, 66, 8, 4); ctx.fill();
      ctx.fillStyle='#8a6b4a';
      roundRect(-14,-5, 16, 10, 3); ctx.fill();
      ctx.restore();
    }
    ctx.restore();

    // 血条
    var bw = 76, bh = 7, bx = p.x-bw/2, by = y-46;
    ctx.fillStyle='rgba(255,255,255,0.16)';
    roundRect(bx,by,bw,bh,4); ctx.fill();
    var hp = Math.max(0,p.hp)/100;
    ctx.fillStyle = hp>0.5 ? '#7ee08a' : (hp>0.25 ? '#ffd166' : '#ff6b6b');
    roundRect(bx,by,bw*hp,bh,4); ctx.fill();

    ctx.textAlign='center';
    ctx.font='600 12px -apple-system,"PingFang SC",sans-serif';
    ctx.fillStyle = p.isPlayer ? '#ffd27a' : 'rgba(255,255,255,0.42)';
    ctx.fillText(k.name, p.x, by-8);
  }

  function draw(now){
    // 台面
    var g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#241a15'); g.addColorStop(0.6,'#191210'); g.addColorStop(1,'#100b09');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

    // 木纹
    ctx.strokeStyle='rgba(255,255,255,0.035)';
    ctx.lineWidth=2;
    for(var i=0;i<7;i++){
      var yy = GROUND + 60 + i*38;
      ctx.beginPath(); ctx.moveTo(0,yy); ctx.lineTo(W,yy); ctx.stroke();
    }

    // 地面线
    ctx.strokeStyle='rgba(255,210,150,0.18)';
    ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(0,GROUND+52); ctx.lineTo(W,GROUND+52); ctx.stroke();

    var order = G.players.slice().sort(function(a,b){ return (a.dead?0:1)-(b.dead?0:1); });
    order.forEach(function(p){ drawSushi(p, now); });

    if(G.msg && (now-G.msgT)<1100){
      var a = 1-(now-G.msgT)/1100;
      ctx.globalAlpha = Math.max(0,a);
      ctx.textAlign='center';
      ctx.fillStyle='#ffe6cf';
      ctx.font='800 26px -apple-system,"PingFang SC",sans-serif';
      ctx.fillText(G.msg, W/2, H*0.3);
      ctx.globalAlpha = 1;
    }
  }

  if(location.hash === '#play'){ setTimeout(start, 200); }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
