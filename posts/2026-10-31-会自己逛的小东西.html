<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>会自己逛的小东西</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    user-select:none;-webkit-user-select:none;touch-action:none;}
  html,body{height:100%;overflow:hidden;background:#0b1020;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
  #c{position:fixed;inset:0;display:block;}
  #tip{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
    text-align:center;color:#5f6b8c;font-size:14px;letter-spacing:.08em;
    pointer-events:none;transition:opacity 1s;}
  #tip.gone{opacity:0;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tip">按住屏幕，看它理不理你</div>
<script>
(function(){
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1;
  var stars = [];
  var TAU = Math.PI * 2;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.floor(W * DPR);
    cv.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    makeStars();
    pet.x = Math.min(pet.x, W - 40);
    pet.y = Math.min(pet.y, H * 0.55);
  }

  function makeStars(){
    stars = [];
    var n = Math.round(W * H / 9000);
    for (var i = 0; i < n; i++){
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.6,
        r: Math.random() * 1.3 + 0.3,
        p: Math.random() * TAU,
        s: 0.5 + Math.random() * 1.2
      });
    }
  }

  // ——— 它 ———
  var pet = {
    x: 0, y: 0, vx: 0, vy: 0, r: 22,
    lookX: 1, lookY: 0,
    state: 'wander',
    t: 0, dur: 2.5,
    tx: 0, ty: 0,
    blink: 0, nextBlink: 2 + Math.random() * 3,
    huntWait: 6 + Math.random() * 4,   // 离下次自己找乐子还有多久
    happy: 0                            // 抓到东西之后的得意，会晃一下
  };

  // ——— 那颗小东西自己要追的光 ———
  var prey = { x: 0, y: 0, vx: 0, vy: 0, r: 6, spin: 0 };
  var sparks = [];   // 抓到时炸开的小点

  var finger = null;
  var glow = 0;

  function rnd(a, b){ return a + Math.random() * (b - a); }

  function placePrey(){
    prey.x = rnd(40, Math.max(60, W - 40));
    prey.y = rnd(60, Math.max(80, H * 0.55));
    prey.vx = rnd(-40, 40);
    prey.vy = rnd(-40, 40);
  }

  function pickTarget(){
    pet.tx = rnd(40, Math.max(60, W - 40));
    pet.ty = rnd(60, Math.max(80, H * 0.58));
  }

  function setState(s){
    pet.state = s;
    pet.t = 0;
    if (s === 'wander'){ pet.dur = rnd(2, 3.5); pickTarget(); }
    else if (s === 'rest'){ pet.dur = rnd(1.2, 2.6); }
    else if (s === 'hunt'){ pet.dur = 12; }
    else { pet.dur = 99; }
  }

  function burst(x, y){
    for (var i = 0; i < 12; i++){
      var a = Math.random() * TAU, sp = rnd(60, 220);
      sparks.push({x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:0.7, max:0.7});
    }
  }

  function init(){
    pet.x = W / 2; pet.y = H * 0.4;
    placePrey();
    setState('wander');
  }

  function update(dt){
    pet.t += dt;
    pet.happy = Math.max(0, pet.happy - dt);

    // 眨眼
    pet.nextBlink -= dt;
    if (pet.nextBlink <= 0){ pet.blink = 0.14; pet.nextBlink = rnd(2, 5); }
    if (pet.blink > 0) pet.blink -= dt;

    // 手指优先：按着就一定去追手指
    if (finger){
      if (pet.state !== 'chase') setState('chase');
      pet.tx = finger.x; pet.ty = finger.y;
      glow = Math.min(1, glow + dt * 6);
    } else if (pet.state === 'chase'){
      glow = Math.max(0, glow - dt * 3);
      setState('wander');
    } else {
      glow = Math.max(0, glow - dt * 3);
    }

    // 它自己隔一会儿会开始玩：追那颗光
    if (!finger && pet.state !== 'hunt'){
      pet.huntWait -= dt;
      if (pet.huntWait <= 0 && pet.t > pet.dur * 0.5){
        setState('hunt');
        pet.huntWait = rnd(7, 13);
      }
    }

    // 状态到期
    if (pet.t > pet.dur){
      if (pet.state === 'wander') setState(Math.random() < 0.3 ? 'rest' : 'wander');
      else if (pet.state === 'rest') setState('wander');
      else if (pet.state === 'hunt') setState('rest');   // 追累了，歇一下
    }

    // 目标
    var tx = pet.tx, ty = pet.ty;
    if (pet.state === 'hunt'){ tx = prey.x; ty = prey.y; }

    var ax = 0, ay = 0;
    if (pet.state === 'rest'){
      ax = -pet.vx * 2.4;
      ay = -pet.vy * 2.4;
    } else {
      var dx = tx - pet.x, dy = ty - pet.y;
      var d = Math.hypot(dx, dy) || 1;
      var pull = pet.state === 'chase' ? 900 : (pet.state === 'hunt' ? 620 : 220);
      var f = Math.min(1, d / 90);
      ax = dx / d * pull * f;
      ay = dy / d * pull * f;
      if (d < 30 && pet.state === 'wander') setState('wander');
    }

    pet.vx += ax * dt;
    pet.vy += ay * dt;

    var damp = Math.pow(0.35, dt);
    pet.vx *= damp; pet.vy *= damp;

    var sp = Math.hypot(pet.vx, pet.vy);
    var maxSp = pet.state === 'chase' ? 520 : (pet.state === 'hunt' ? 400 : 190);
    if (sp > maxSp){ pet.vx *= maxSp / sp; pet.vy *= maxSp / sp; }

    pet.x += pet.vx * dt;
    pet.y += pet.vy * dt;

    var m = pet.r + 6;
    if (pet.x < m){ pet.x = m; pet.vx = Math.abs(pet.vx) * 0.6; }
    if (pet.x > W - m){ pet.x = W - m; pet.vx = -Math.abs(pet.vx) * 0.6; }
    if (pet.y < m){ pet.y = m; pet.vy = Math.abs(pet.vy) * 0.6; }
    if (pet.y > H * 0.72){ pet.y = H * 0.72; pet.vy = -Math.abs(pet.vy) * 0.6; }

    // 眼睛
    var want = {x: tx - pet.x, y: ty - pet.y};
    var wd = Math.hypot(want.x, want.y) || 1;
    pet.lookX += (want.x / wd - pet.lookX) * Math.min(1, dt * 8);
    pet.lookY += (want.y / wd - pet.lookY) * Math.min(1, dt * 8);

    // ——— 光点自己漂，也会躲 ———
    prey.spin += dt * 2.2;
    var pdx = prey.x - pet.x, pdy = prey.y - pet.y;
    var pd = Math.hypot(pdx, pdy) || 1;
    if (pd < 210){
      // 被盯上了，跑
      var flee = (210 - pd) / 210;
      prey.vx += pdx / pd * 900 * flee * dt;
      prey.vy += pdy / pd * 900 * flee * dt;
    }
    // 手指也把它赶开
    if (finger){
      var fdx = prey.x - finger.x, fdy = prey.y - finger.y;
      var fd = Math.hypot(fdx, fdy) || 1;
      if (fd < 150){
        prey.vx += fdx / fd * 700 * (1 - fd / 150) * dt;
        prey.vy += fdy / fd * 700 * (1 - fd / 150) * dt;
      }
    }
    // 慢慢游荡的力
    prey.vx += Math.cos(prey.spin * 0.7) * 18 * dt;
    prey.vy += Math.sin(prey.spin * 1.1) * 18 * dt;

    var pdf = Math.pow(0.2, dt);
    prey.vx *= pdf; prey.vy *= pdf;
    var ps = Math.hypot(prey.vx, prey.vy);
    var pMax = pd < 210 ? 300 : 110;
    if (ps > pMax){ prey.vx *= pMax / ps; prey.vy *= pMax / ps; }
    prey.x += prey.vx * dt;
    prey.y += prey.vy * dt;

    var pm = 20;
    if (prey.x < pm){ prey.x = pm; prey.vx = Math.abs(prey.vx); }
    if (prey.x > W - pm){ prey.x = W - pm; prey.vx = -Math.abs(prey.vx); }
    if (prey.y < pm){ prey.y = pm; prey.vy = Math.abs(prey.vy); }
    if (prey.y > H * 0.6){ prey.y = H * 0.6; prey.vy = -Math.abs(prey.vy); }

    // 抓到了
    if (pet.state === 'hunt' && Math.hypot(prey.x - pet.x, prey.y - pet.y) < pet.r + 10){
      burst(prey.x, prey.y);
      pet.happy = 0.9;
      pet.vx *= -0.5; pet.vy *= -0.5;
      setState('rest');
      placePrey();
    }

    // 火花
    for (var i = sparks.length - 1; i >= 0; i--){
      var s = sparks[i];
      s.life -= dt;
      if (s.life <= 0){ sparks.splice(i, 1); continue; }
      s.x += s.vx * dt; s.y += s.vy * dt;
      s.vx *= Math.pow(0.2, dt); s.vy *= Math.pow(0.2, dt);
    }
  }

  function draw(now){
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0a0f1f');
    g.addColorStop(0.55, '#101a33');
    g.addColorStop(1, '#08101f');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 远处那条线
    var hy = H * 0.66;
    var hg = ctx.createLinearGradient(0, hy, 0, H);
    hg.addColorStop(0, 'rgba(90,150,220,.16)');
    hg.addColorStop(1, 'rgba(90,150,220,0)');
    ctx.fillStyle = hg;
    ctx.fillRect(0, hy, W, H - hy);
    ctx.strokeStyle = 'rgba(120,170,240,.18)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, hy); ctx.lineTo(W, hy); ctx.stroke();

    // 星星
    for (var i = 0; i < stars.length; i++){
      var s = stars[i];
      var a = 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(now / 900 * s.s + s.p));
      ctx.fillStyle = 'rgba(200,225,255,' + a.toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
    }

    // 光点：它自己的玩具
    var pg2 = ctx.createRadialGradient(prey.x, prey.y, 0, prey.x, prey.y, 34);
    pg2.addColorStop(0, 'rgba(255,235,170,.95)');
    pg2.addColorStop(0.35, 'rgba(255,190,90,.45)');
    pg2.addColorStop(1, 'rgba(255,160,60,0)');
    ctx.fillStyle = pg2;
    ctx.beginPath(); ctx.arc(prey.x, prey.y, 34, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffe7a8';
    ctx.beginPath(); ctx.arc(prey.x, prey.y, prey.r, 0, TAU); ctx.fill();

    // 火花
    for (var k = 0; k < sparks.length; k++){
      var sp = sparks[k], t = sp.life / sp.max;
      ctx.fillStyle = 'rgba(255,220,150,' + (0.85 * t).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(sp.x, sp.y, 2 + 2 * t, 0, TAU); ctx.fill();
    }

    // 手指的光
    if (glow > 0.01 && finger){
      var rg = ctx.createRadialGradient(finger.x, finger.y, 0, finger.x, finger.y, 130 * glow);
      rg.addColorStop(0, 'rgba(255,220,150,' + (0.5 * glow).toFixed(3) + ')');
      rg.addColorStop(0.4, 'rgba(255,190,110,' + (0.18 * glow).toFixed(3) + ')');
      rg.addColorStop(1, 'rgba(255,180,90,0)');
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(finger.x, finger.y, 130 * glow, 0, TAU); ctx.fill();
    }

    // 它
    var ang = Math.atan2(pet.vy, pet.vx);
    var speed = Math.hypot(pet.vx, pet.vy);
    var squash = Math.min(0.18, speed / 2600);
    ctx.save();
    ctx.translate(pet.x, pet.y);
    ctx.rotate(ang);
    ctx.scale(1 + squash, 1 - squash);
    var pg = ctx.createRadialGradient(-pet.r * 0.3, -pet.r * 0.3, 2, 0, 0, pet.r * 2.2);
    pg.addColorStop(0, 'rgba(180,240,255,1)');
    pg.addColorStop(0.45, 'rgba(90,200,235,.95)');
    pg.addColorStop(1, 'rgba(50,120,190,0)');
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.arc(0, 0, pet.r * 2.2, 0, TAU); ctx.fill();
    ctx.fillStyle = '#0d1a2e';
    ctx.beginPath(); ctx.arc(0, 0, pet.r, 0, TAU); ctx.fill();
    ctx.restore();

    // 脸
    ctx.save();
    var wob = pet.happy > 0 ? Math.sin(now / 60) * 3 * (pet.happy / 0.9) : 0;
    ctx.translate(pet.x + (pet.happy > 0 ? 0 : 0), pet.y - (pet.happy > 0 ? Math.abs(wob) : 0));
    var ex = pet.lookX * 7, ey = pet.lookY * 7;
    var open = pet.blink > 0 ? 0.12 : 1;
    var rEye = 6.2;
    ctx.fillStyle = '#eaf7ff';
    ctx.beginPath();
    ctx.ellipse(-5 + ex, -4 + ey, rEye, rEye * open, 0, 0, TAU);
    ctx.ellipse(  7 + ex, -4 + ey, rEye, rEye * open, 0, 0, TAU);
    ctx.fill();
    if (pet.blink <= 0){
      ctx.fillStyle = '#101c30';
      ctx.beginPath();
      ctx.arc(-5 + ex * 1.4, -4 + ey * 1.4, 2.6, 0, TAU);
      ctx.arc( 7 + ex * 1.4, -4 + ey * 1.4, 2.6, 0, TAU);
      ctx.fill();
    }
    ctx.strokeStyle = 'rgba(160,220,245,.7)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    if (pet.happy > 0){
      // 抓到了，张开嘴笑
      ctx.arc(1, 3, 5.5, 0.05 * Math.PI, 0.95 * Math.PI);
    } else {
      ctx.arc(1, 5, 4.5, 0.15 * Math.PI, 0.85 * Math.PI);
    }
    ctx.stroke();
    ctx.restore();

    // 歇着冒泡泡
    if (pet.state === 'rest'){
      var k = (pet.t % 1.6) / 1.6;
      ctx.fillStyle = 'rgba(170,215,245,' + (0.55 * (1 - k)).toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(pet.x + 26, pet.y - 26 - k * 26, 2.5 + k * 3.5, 0, TAU);
      ctx.fill();
    }
  }

  var last = 0, acc = 0;
  function loop(now){
    if (!last) last = now;
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    acc += dt;
    while (acc >= 1 / 60){ update(1 / 60); acc -= 1 / 60; }
    draw(now);
    requestAnimationFrame(loop);
  }

  // ——— 手指 ———
  var tip = document.getElementById('tip');
  var touched = false;
  function pos(e){
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function down(e){ finger = pos(e); if (!touched){ touched = true; tip.classList.add('gone'); } }
  function move(e){ if (finger) finger = pos(e); }
  function up(){ finger = null; }

  cv.addEventListener('touchstart', function(e){ e.preventDefault(); down(e); }, {passive:false});
  cv.addEventListener('touchmove', function(e){ e.preventDefault(); move(e); }, {passive:false});
  cv.addEventListener('touchend', function(e){ e.preventDefault(); up(); }, {passive:false});
  cv.addEventListener('touchcancel', up);
  cv.addEventListener('mousedown', down);
  cv.addEventListener('mousemove', move);
  window.addEventListener('mouseup', up);

  window.addEventListener('resize', resize);
  resize();
  init();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
