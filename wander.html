<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>自己走的小点</title>
<style>
  html,body{margin:0;height:100%;background:#111;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W, H;
function fit(){ W = cv.width = cv.clientWidth; H = cv.height = cv.clientHeight; }
fit();
addEventListener('resize', fit);

// 一个小点，每帧随机转一个小角度往前走
let x = W/2, y = H/2, ang = Math.random()*Math.PI*2, spd = 2;
const trail = [];
const MAX = 1200;
let steps = 0;

// 记录走过的方向，用来粗略看会不会偏向某一边
let sumX = 0, sumY = 0;

function walk(){
  // 每步随机拐一点，角度小所以走得连贯
  ang += (Math.random()-0.5) * 0.5;
  x += Math.cos(ang) * spd;
  y += Math.sin(ang) * spd;
  sumX += Math.cos(ang);
  sumY += Math.sin(ang);
  steps++;

  // 碰边就弹回来
  if (x < 0 || x > W){ ang = Math.PI - ang; x = Math.max(0, Math.min(W, x)); }
  if (y < 0 || y > H){ ang = -ang; y = Math.max(0, Math.min(H, y)); }

  trail.push([x, y]);
  if (trail.length > MAX) trail.shift();
}

function draw(){
  ctx.fillStyle = 'rgba(17,17,17,0.08)';
  ctx.fillRect(0,0,W,H);

  ctx.beginPath();
  for (let i=0;i<trail.length;i++){
    const p = trail[i];
    if (i===0) ctx.moveTo(p[0],p[1]); else ctx.lineTo(p[0],p[1]);
  }
  ctx.strokeStyle = '#5fd3a0';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(x, y, 3, 0, Math.PI*2);
  ctx.fillStyle = '#fff';
  ctx.fill();

  ctx.fillStyle = '#888';
  ctx.font = '12px monospace';
  ctx.fillText('steps ' + steps, 10, 18);

  // 平均方向，如果两个数都接近0说明方向被平均掉了（没有偏好）
  if (steps > 0){
    ctx.fillText('avg ' + (sumX/steps).toFixed(3) + ', ' + (sumY/steps).toFixed(3), 10, 34);
  }
}

function loop(){
  walk();
  walk(); // 每帧走两步，快一点
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
