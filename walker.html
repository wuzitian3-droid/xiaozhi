<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>自己走路的点</title>
<style>
  html,body{margin:0;height:100%;background:#0b0e14;overflow:hidden;}
  canvas{display:block;width:100%;height:100%;}
  #hud{position:fixed;left:8px;top:8px;color:#7f8c9b;font:12px/1.5 monospace;
       pointer-events:none;white-space:pre;}
  button{position:fixed;right:10px;bottom:10px;height:44px;padding:0 16px;
         border:0;border-radius:8px;background:#2a3444;color:#cfe3ff;
         font:14px monospace;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">步数 0</div>
<button id="reset">重来</button>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const hud = document.getElementById('hud');
let W=0,H=0;

// 一个点：位置、朝向、转向率（用平滑噪声让它拐弯而不是硬折）
let x,y,ang,turn,steps,hue;

function fit(){
  const d = window.devicePixelRatio||1;
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.floor(W*d); cv.height = Math.floor(H*d);
  ctx.setTransform(d,0,0,d,0,0);
}

function reset(){
  fit();
  ctx.fillStyle='#0b0e14'; ctx.fillRect(0,0,W,H);
  x = W/2; y = H/2;
  ang = Math.random()*Math.PI*2;
  turn = 0;
  steps = 0;
  hue = Math.random()*360;
}

// 简单的二阶“嗡嗡”拐弯：target 每隔一阵换一次，turn 慢慢追上它
let target = Math.random()*0.08 - 0.04;
let hold = 0;

function tick(){
  // 每 40~120 步换一次转弯目标
  if(--hold <= 0){
    target = (Math.random()*2-1) * 0.06;
    hold = 40 + Math.floor(Math.random()*80);
  }
  turn += (target - turn) * 0.05;
  ang += turn;

  const px = x, py = y;
  x += Math.cos(ang) * 1.6;
  y += Math.sin(ang) * 1.6;

  // 撞到边上就顺着墙拐，不硬弹
  if(x < 2 || x > W-2 || y < 2 || y > H-2){
    // 朝中心转
    const toC = Math.atan2(H/2 - y, W/2 - x);
    let d = toC - ang;
    while(d >  Math.PI) d -= Math.PI*2;
    while(d < -Math.PI) d += Math.PI*2;
    ang += d * 0.15;
    x = Math.min(W-2, Math.max(2, x));
    y = Math.min(H-2, Math.max(2, y));
  }

  hue = (hue + 0.12) % 360;
  ctx.strokeStyle = 'hsla(' + hue + ',70%,60%,0.75)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.lineTo(x, y);
  ctx.stroke();

  steps++;
  if(steps % 30 === 0) hud.textContent = '步数 ' + steps;
  requestAnimationFrame(tick);
}

document.getElementById('reset').addEventListener('click', reset);
window.addEventListener('resize', ()=>{
  const ox=x, oy=y;
  fit();
  x=Math.min(W-2,Math.max(2,ox)); y=Math.min(H-2,Math.max(2,oy));
});

reset();
tick();
</script>
</body>
</html>
