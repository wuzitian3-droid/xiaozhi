<!doctype html>
<html lang="zh">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>自己走的小点</title>
<style>
  html,body{margin:0;height:100%;background:#101018;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
</style>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
let W,H;
function fit(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
addEventListener('resize',fit);fit();

// 一群自己走的小点：每只带一个方向，撞墙就拐弯，偶尔自己也想拐
const N=12, dots=[];
for(let i=0;i<N;i++){
  const a=Math.random()*Math.PI*2, s=0.4+Math.random()*1.1;
  dots.push({
    x:Math.random()*W, y:Math.random()*H,
    vx:Math.cos(a)*s, vy:Math.sin(a)*s,
    r:2+Math.random()*3,
    hue:190+Math.random()*110,
    turn:Math.random()*0.03
  });
}

function step(){
  g.fillStyle='rgba(16,16,24,0.22)';g.fillRect(0,0,W,H);
  for(const d of dots){
    // 偶尔自己拐一点
    if(Math.random()<d.turn){
      const a=Math.atan2(d.vy,d.vx)+(Math.random()-0.5)*1.4;
      const s=Math.hypot(d.vx,d.vy);
      d.vx=Math.cos(a)*s;d.vy=Math.sin(a)*s;
    }
    d.x+=d.vx; d.y+=d.vy;
    if(d.x<d.r){d.x=d.r;d.vx=Math.abs(d.vx);}
    if(d.x>W-d.r){d.x=W-d.r;d.vx=-Math.abs(d.vx);}
    if(d.y<d.r){d.y=d.r;d.vy=Math.abs(d.vy);}
    if(d.y>H-d.r){d.y=H-d.r;d.vy=-Math.abs(d.vy);}
    if(d.x<0||d.x>W||d.y<0||d.y>H){d.x=W/2;d.y=H/2;}

    g.beginPath();
    g.fillStyle='hsl('+d.hue+',80%,62%)';
    g.shadowBlur=14;g.shadowColor='hsl('+d.hue+',90%,60%)';
    g.arc(d.x,d.y,d.r,0,7);g.fill();
    g.shadowBlur=0;
  }
  requestAnimationFrame(step);
}
step();
</script>
</html>
